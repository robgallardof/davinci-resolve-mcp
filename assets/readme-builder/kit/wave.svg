<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44" role="img" aria-label="Section divider" data-readme-component="divider"><title>Section divider</title><defs><linearGradient id="kb" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset=".55" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><linearGradient id="kbd" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset=".55" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif}.w1{animation:flow 9s linear infinite}.w2{animation:flow2 14s linear infinite}@keyframes flow{to{transform:translateX(160px)}}@keyframes flow2{to{transform:translateX(-240px)}}.pulse{transform-origin:600px 22px;animation:pulse 4s ease-out infinite}@keyframes pulse{0%{opacity:.7;transform:scale(.6)}70%,100%{opacity:0;transform:scale(1.6)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="fade" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".2" stop-color="#fff"/><stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="edge"><rect width="1200" height="44" fill="url(#fade)"/></mask></defs><g mask="url(#edge)"><path class="w1" d="M-160 22 q40 -9 80 0 t80 0 q40 -9 80 0 t80 0 q40 -9 80 0 t80 0 q40 -9 80 0 t80 0 q40 -9 80 0 t80 0 q40 -9 80 0 t80 0 q40 -9 80 0 t80 0 q40 -9 80 0 t80 0 q40 -9 80 0 t80 0 q40 -9 80 0 t80 0" fill="none" stroke="url(#kb)" stroke-width="2" stroke-linecap="round" opacity=".75"/><path class="w2" d="M-240 22 q60 -6 120 0 t120 0 q60 -6 120 0 t120 0 q60 -6 120 0 t120 0 q60 -6 120 0 t120 0 q60 -6 120 0 t120 0 q60 -6 120 0 t120 0 q60 -6 120 0 t120 0" fill="none" stroke="url(#kb)" stroke-width="1.2" opacity=".35"/></g><rect x="593" y="15" width="14" height="14" rx="3" transform="rotate(45 600 22)" fill="#4