# resolve-forge over Streamable HTTP with a bearer token. stdio needs no compose (docs/docker.md).
# Resolve runs on the host with its bridge started (Workspace > Scripts > resolve_bridge).
#   RESOLVE_FORGE_MCP_TOKEN=<token> FORGE_MEDIA=C:/Users/me/Movies docker compose up -d --build --wait
services:
  resolve-forge:
    build:
      context: .
      args:
        EXTRAS: ${RESOLVE_FORGE_EXTRAS:-vision}
    image: resolve-forge:local
    user: ${RESOLVE_FORGE_USER:-10001:10001}
    init: true
    command: ["--http", "--listen", "0.0.0.0:8080"]
    environment:
      RESOLVE_FORGE_MCP_TOKEN: ${RESOLVE_FORGE_MCP_TOKEN:?Set RESOLVE_FORGE_MCP_TOKEN to a random token of at least 32 characters}
      FORGE_BRIDGE_HOST: ${FORGE_BRIDGE_HOST:-host.docker.internal}
      FORGE_PATH_MAP: /media=${FORGE_MEDIA:?Set FORGE_MEDIA to the host folder Resolve imports and renders in (e.g. C:/Users/me/Movies)}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${RESOLVE_FORGE_BIND_ADDRESS:-127.0.0.1}:${RESOLVE_FORGE_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${FORGE_MEDIA}
        target: /media
      - type: bind
        source: ${FORGE_BRIDGE_CONFIG_FILE:-~/.config/davinci-resolve-mcp/bridge.json}
        target: /config/bridge.json
        read_only: true
      - type: bind
        source: ${RESOLVE_FORGE_WORKSPACE:-.}
        target: /workspace
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
